name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Linux UI review prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth scrot xdotool

      - name: Install Python audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Provision screenshot tooling
        run: |
          npx -y universal-screenshot-mcp --doctor

      - name: Verify Tkinter import
        run: |
          python - <<'PY'
          import tkinter
          print("tkinter-ok")
          PY
